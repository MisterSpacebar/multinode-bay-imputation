name: Trustworthy Phase 1 tests

on:
  pull_request:
    paths:
      - "trustworthy/**"
      - "preprocess.py"
      - ".github/workflows/trustworthy-tests.yml"
  push:
    branches: [main]
    paths:
      - "trustworthy/**"
      - "preprocess.py"
      - ".github/workflows/trustworthy-tests.yml"

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tested audit dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3"
      - name: Run synthetic unit tests
        run: python -m unittest discover -s trustworthy/tests -v
      - name: Compile changed Python files
        run: python -m py_compile trustworthy/*.py trustworthy/tests/*.py preprocess.py
